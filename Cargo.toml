[workspace]
resolver = "2"
members = ["geist/policy", "geist/edge", "geist/bin"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mox-labs/geist.sh"
authors = ["Yashodeep Vyas"]

[workspace.dependencies]
# Internal
geist-policy = { path = "geist/policy" }
geist-edge = { path = "geist/edge" }

# Core (path deps on x.uma — package key needed: lib=rumi, package=rumi-core)
rumi = { path = "../x.uma/rumi/core", package = "rumi-core", features = ["serde"] }
rumi-http = { path = "../x.uma/rumi/ext/http" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
