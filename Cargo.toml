[workspace]
resolver = "2"
members = [
    "geist/edge",
    "geist/bin",
]

default-members = ["geist/edge", "geist/bin"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/mox-labs/geist.sh"
authors = ["Yashodeep Vyas"]

[workspace.dependencies]
# Internal
geist-edge = { path = "geist/edge" }
slickit = { path = "../slick" }

# Core (path deps on x.uma — package key needed: lib=rumi, package=rumi-core)
rumi = { path = "../x.uma/rumi/core", package = "rumi-core", features = ["serde"] }
rumi-http = { path = "../x.uma/rumi/ext/http" }

# Extension registration
inventory = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
