[workspace]
resolver = "2"
members = [
    "geist/edge",
    "geist/bin",
    "geist/cli",
]

default-members = ["geist/edge", "geist/bin", "geist/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/mox-labs/geist.sh"
authors = ["Yashodeep Vyas"]

[workspace.dependencies]
# Internal
geist-edge = { path = "geist/edge" }
slickit = "0.1.0"

# Core (path deps on x.uma — package key needed: lib=rumi, package=rumi-core)
rumi = { path = "../x.uma/rumi/core", package = "rumi-core", features = ["serde"] }
rumi-http = { path = "../x.uma/rumi/ext/http" }

# Extension registration
inventory = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Protocol vocabulary
http = "1"
bytes = "1"

# Async
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32"
