[workspace]
resolver = "2"
members = [
    "geist/edge",
    "geist/acl",
    "geist/bin",
    "slick/types",
    "slick/crusts/python",
    "slick/crusts/wasm",
]

# Crusts use specialized build tools (maturin, wasm-pack) — test individually, not via cargo test
default-members = ["geist/edge", "geist/acl", "geist/bin", "slick/types"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mox-labs/geist.sh"
authors = ["Yashodeep Vyas"]

[workspace.dependencies]
# Internal
geist-edge = { path = "geist/edge" }
geist-acl = { path = "geist/acl" }
slick-types = { path = "slick/types" }

# Core (path deps on x.uma — package key needed: lib=rumi, package=rumi-core)
rumi = { path = "../x.uma/rumi/core", package = "rumi-core", features = ["serde"] }
rumi-http = { path = "../x.uma/rumi/ext/http" }

# Extension registration
inventory = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# FFI crusts (PyO3 + wasm-bindgen)
pyo3 = { version = "0.25", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Async
tokio = { version = "1", features = ["full"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
