# Run from the mox/ parent directory:
#   docker compose -f geist.sh/docker-compose.yml up
#
# Or from the geist.sh/ directory with explicit context:
#   docker compose up
#
# The build context must include ../slick and ../x.uma (path deps).

services:
  geist-edge:
    build:
      context: ..
      dockerfile: geist.sh/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
