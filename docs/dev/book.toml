[book]
title = "geist.sh"
authors = ["Mox Labs"]
language = "en"
src = "src"

[build]
build-dir = "book"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mox-labs/geist.sh"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
