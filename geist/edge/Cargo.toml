[package]
name = "geist-edge"
description = "Composable data plane runtime for geist.sh — processor pipeline and adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
adapter-axum = ["dep:axum", "dep:tower", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio"]

[dependencies]
# Core: matcher engine + ext_proc types (ProcessingRequest/Response, HttpMessage)
rumi.workspace = true
rumi-http.workspace = true
envoy-grpc-ext-proc = "0.1"

# Extension registration
inventory.workspace = true

# Serialization + observability (always)
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Adapter deps (feature-gated)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }


[dev-dependencies]
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
geist-acl = { workspace = true }
hyper-util = { workspace = true }
serde_json.workspace = true
tempfile = "3"
