[project]
name = "geist-run"
version = "0.0.1"
description = "Agent runtime for geist.sh"
authors = [
    { name = "Mox Labs" }
]
license = "BUSL-1.1"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52",
    "rich>=13",
    "click>=8",
    "pyyaml>=6",
]

[project.scripts]
geist-run = "geist_run.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
